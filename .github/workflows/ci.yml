name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fixture is reproducible from its generator
        run: python tests/make_fixture.py && git diff --exit-code tests/fixtures
      - name: Unit and end-to-end tests (dbt build + dbt tests on the fixture, reproducibility check)
        run: python -m pytest -q
      - name: Batch pipeline on the fixture without Airflow
        run: make fixture-pipeline
      - name: README numbers match the committed results files
        run: PYTHONPATH=src python -m lakehouse summarize --check
      - name: Mutation check (every planted bug must fail a test)
        run: python tests/mutate.py

  spark:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-spark.txt
      - name: Use the runner's preinstalled JDK 17
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          "$JAVA_HOME_17_X64/bin/java" -version
      - name: PySpark models equal the dbt tables on the fixture; streaming sink idempotency and dead letters
        run: python -m pytest -q tests/test_spark.py
      - name: Spark mutation check (every planted bug in the Spark code must fail a test)
        run: python tests/mutate.py --spark

  stack-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Start Redpanda and MinIO
        run: |
          cp .env.example .env
          sed -i "s#^SOURCE_DIR_HOST=.*#SOURCE_DIR_HOST=$PWD/tests/fixtures/raw/datamall#" .env
          docker compose up -d --wait redpanda
          docker compose up -d minio
      - name: Kafka -> MinIO Delta bronze -> dbt; coherent gold publication on MinIO
        run: bash scripts/stack_smoke.sh
      - name: Stop the stack
        if: always()
        run: docker compose down -v
