# Thresholds for the custom data-quality checks (src/lakehouse/quality.py).
# severity: error -> the check fails the pipeline in --strict mode (Airflow runs strict);
#           warn  -> reported, pipeline continues;  info -> reported only.

snapshot_completeness:
  severity: error
  min_ratio: 0.99
  why: >
    Share of metadata links present in a snapshot. A partial snapshot biases every per-link average and breaks
    congestion episodes (a missing link ends a run).

stale_snapshot:
  severity: warn
  min_changed_share: 0.05
  why: >
    Share of links whose band changed since the previous snapshot. A cached or repeated API response changes
    nothing (0%). In the 25 real snapshots used for the README, 18.7%-48.2% of links changed between consecutive
    snapshots, including a pair only 5 minutes apart. The threshold of 5% sits well below the smallest observed
    change and well above a repeat, so it flags a repeated or mostly repeated response without flagging a quiet
    interval. (Before 2026-09-28 it was 0.5%, a guess made before any data was sampled.)

cadence_gap:
  severity: warn
  expected_minutes: 20
  max_gap_minutes: 30
  min_gap_minutes: 10
  why: >
    The sampler waits 15 minutes after each fetch, so snapshots should be about 15-22 minutes apart (observed:
    17-21 minutes). A gap longer than 30 minutes means at least one fetch is missing; much shorter gaps mean an
    extra fetch outside the loop. dbt uses the same 30 minutes (var max_gap_minutes) to start a new sampling run,
    so a congestion episode never bridges a missing fetch; tests/test_quality.py checks that the two agree.

unknown_link_ids:
  severity: error
  max_count: 0
  why: Links in the snapshots that are not in the link metadata cannot be placed on a road or given a road category.

unobserved_metadata_links:
  severity: info
  why: Links in the metadata never seen in any snapshot (reported for information).

unknown_band_share:
  severity: warn
  max_share: 0.001
  why: The DataMall documentation defines bands 1-8. Other values are kept in bronze and set to NULL in silver.

sampler_log_consistency:
  severity: info
  why: >
    sampler.log gets one line per fetch made by the sampler loop. A different count from the number of snapshot
    files means some files were fetched outside the loop or some fetches failed. The log has no timestamps, so it
    cannot be restricted to the pipeline's snapshot cutoff: the check compares the whole log with the whole folder
    at the moment it runs, and its result changes while the sampler is still running. That is why it is
    information only and never fails or warns.

od_vs_tapin:
  severity: error
  max_relative_diff: 0.001
  why: >
    Every OD trip starts with a tap-in, so monthly OD trips and stop tap-ins should agree closely for each day type.
    A larger difference points to a truncated file or a load error.

pv_stops_missing_from_master:
  severity: warn
  max_share_of_tap_ins: 0.01
  why: Stops in the passenger volumes that are not in the current stop list (closed, renumbered or temporary stops).

quarantine_share:
  severity: warn
  max_share: 0.0001
  why: Share of source rows rejected by the batch ingest rules (see bronze/_quarantine).
