version: 2

sources:
  - name: bronze
    description: >
      Raw data landed in the lake by the Python ingest code (src/lakehouse). Every table is a Delta Lake table
      (written with delta-rs, read with DuckDB's delta_scan), partitioned as shown per table. Column names and values
      are as published by LTA DataMall; only types are enforced.
    meta:
      layer: bronze
      provider: "Land Transport Authority (LTA) DataMall"
      licence: "Singapore Open Data Licence v1.0 (see docs/GOVERNANCE.md)"
      contains_pii: false
    tables:
      - name: speedbands
        description: >
          Traffic speed band of every road link in each sampled snapshot (DataMall Traffic Speed Bands v4).
          Written by the Kafka consumer or the file backfill with a Delta MERGE that only inserts new
          (snapshot_ts, link_id) keys. Partitioned by obs_date, obs_hour (event time) and part (Kafka partition).
        meta:
          external_location: "delta_scan('{{ env_var('LAKE_ROOT') }}/bronze/speedbands')"
          source_endpoint: "ltaodataservice/v4/TrafficSpeedBands"
        columns:
          - name: snapshot_ts
            description: Event time of the snapshot, SGT (UTC+8), taken from the sampler's file name (fetch start).
          - name: link_id
            description: LTA road link identifier.
          - name: speed_band
            description: "Speed band 1-8 as published (1 = 0-9 km/h ... 8 = 70 km/h or more); 0 is undocumented."
          - name: min_speed
            description: Lower bound of the band, km/h.
          - name: max_speed
            description: Upper bound of the band, km/h (999 for band 8).
          - name: _source
            description: "'stream' (Kafka consumer) or 'file' (file backfill); the first writer of a key wins."
          - name: _ingested_at
            description: Wall-clock time (UTC) the row was first written to bronze.
          - name: _late
            description: True if the consumer saw the snapshot behind its watermark; NULL for rows from the file backfill.
          - name: obs_date
            description: Partition column, the date of snapshot_ts.
          - name: obs_hour
            description: Partition column, the hour of snapshot_ts.
          - name: part
            description: Partition column, the Kafka partition of the link (link_id % partitions).
      - name: speedband_links
        description: Link geometry and road metadata for the speed-band links, one pull, replaced as a whole on each load.
        meta:
          external_location: "delta_scan('{{ env_var('LAKE_ROOT') }}/bronze/speedband_links')"
      - name: pv_stop
        description: >
          Passenger Volume by Bus Stops: monthly tap-in and tap-out counts per stop, hour and day type, summed over
          all days of that type in the month. Partitioned by month (YYYY-MM); a reload replaces its month in one commit.
        meta:
          external_location: "delta_scan('{{ env_var('LAKE_ROOT') }}/bronze/pv_stop')"
          source_endpoint: "ltaodataservice/PV/Bus"
      - name: pv_od
        description: >
          Passenger Volume by Origin Destination Bus Stops: monthly trips per origin stop, destination stop, hour and
          day type. About 6 million rows a month. Partitioned by month (YYYY-MM); a reload replaces its month in one commit.
        meta:
          external_location: "delta_scan('{{ env_var('LAKE_ROOT') }}/bronze/pv_od')"
          source_endpoint: "ltaodataservice/PV/ODBus"
      - name: bus_stops
        description: Bus stop master (BusStops endpoint), partitioned by pull date as_of (YYYYMMDD).
        meta:
          external_location: "delta_scan('{{ env_var('LAKE_ROOT') }}/bronze/bus_stops')"
      - name: bus_services
        description: Bus services (BusServices endpoint), partitioned by pull date as_of (YYYYMMDD).
        meta:
          external_location: "delta_scan('{{ env_var('LAKE_ROOT') }}/bronze/bus_services')"
      - name: bus_routes
        description: Stop sequence of every service direction (BusRoutes endpoint), partitioned by pull date as_of (YYYYMMDD).
        meta:
          external_location: "delta_scan('{{ env_var('LAKE_ROOT') }}/bronze/bus_routes')"
