# No secrets in this file: S3 settings come from the environment (see .env.example). With a local LAKE_ROOT the
# S3 secret is unused. DuckDB's delta extension reads credentials from a DuckDB secret (not the s3_* settings).
sg_traffic:
  target: default
  outputs:
    default:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH') }}"
      threads: 4
      extensions: [httpfs, parquet, delta]
      settings:
        memory_limit: "{{ env_var('DUCKDB_MEMORY', '1500MB') }}"
      secrets:
        - type: s3
          key_id: "{{ env_var('AWS_ACCESS_KEY_ID', '') }}"
          secret: "{{ env_var('AWS_SECRET_ACCESS_KEY', '') }}"
          endpoint: "{{ env_var('S3_ENDPOINT', '') }}"
          url_style: path
          use_ssl: false
          region: us-east-1
